<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #68758a; }
      .section { font-size: 24px; font-weight: 800; }
      .box-title { font-size: 19px; font-weight: 750; text-anchor: middle; }
