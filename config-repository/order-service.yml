server:
  port: 8084

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    hikari:
      connection-timeout: 3000
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topic:
    delivery-compensation: ${DELIVERY_COMPENSATION_TOPIC:delivery-compensation}
  outbox:
    publish-interval-ms: ${DELIVERY_COMPENSATION_PUBLISH_INTERVAL_MS:5000}

internal:
  service:
    allowed-name: delivery-service
    name: order-service
    key: ${INTERNAL_SERVICE_KEY}
