server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: hub-service
              uri: lb://hub-service
              predicates:
                - Path=/api/hubs/**,/api/hub-routes/**
            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/api/companies/**,/api/products/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/deliveries/**,/api/delivery-agents/**
            - id: ai-notification-service
              uri: lb://ai-notification-service
              predicates:
                - Path=/api/ai-requests/**,/api/slack-messages/**
            # 서비스별 Swagger API 문서 라우팅
            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/docs/user/**
              filters:
                - StripPrefix=2

            - id: hub-service-docs
              uri: lb://hub-service
              predicates:
                - Path=/docs/hub/**
              filters:
                - StripPrefix=2

            - id: company-service-docs
              uri: lb://company-service
              predicates:
                - Path=/docs/company/**
              filters:
                - StripPrefix=2

            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/docs/order/**
              filters:
                - StripPrefix=2

            - id: delivery-service-docs
              uri: lb://delivery-service
              predicates:
                - Path=/docs/delivery/**
              filters:
                - StripPrefix=2

            - id: ai-notification-service-docs
              uri: lb://ai-notification-service
              predicates:
                - Path=/docs/ai/**
              filters:
                - StripPrefix=2
          # 특정 서비스가 멈췄을 때 Gateway 요청이 계속 대기하지 않도록
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          # 프론트엔드나 Swagger가 Gateway API를 호출할 수 있도록
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - Authorization
                  - X-Request-Id
                allow-credentials: true
                max-age: 3600

management:
  server:
    # 외부 요청 포트(8080)와 분리된 Docker 내부 관리 포트
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway

jwt:
  secret: ${JWT_SECRET}

gateway:
  security:
    # 로그인, 회원가입, Swagger 문서처럼 JWT 검증을 생략하는 공개 경로
    permit-all:
      - /api/auth/login
      - /api/auth/re-issue
      - /api/auth/logout
      - /api/users/signup
      - /docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**

    # 경로별 필요 role 매핑. 위에서부터 순서대로 첫 매치 규칙을 적용하니
    # 더 구체적인 경로를 먼저, 넓은 경로(**)를 나중에 적는다.
    # 아무 규칙에도 안 걸리면 기본은 "거부"로 처리할 예정 (신규 API 추가 시 규칙 누락 방지).
    # 팀원별로 담당 서비스 섹션에 규칙 추가해주세요.

    rules:
      # --- user-service ---
      - path: /api/users/*/approved
        methods: [PATCH]
        roles: [MASTER]
      - path: /api/users/*/rejected
        methods: [PATCH]
        roles: [MASTER]
      - path: /api/users/me
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/users/*
        methods: [PATCH, DELETE]
        roles: [MASTER]
      - path: /api/users
        methods: [GET, POST]
        roles: [MASTER]

      # --- hub-service ---
      - path: /api/hubs
        methods: [POST]
        roles: [MASTER]
      - path: /api/hubs
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/hubs/*
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/hubs/*
        methods: [PATCH, DELETE]
        roles: [MASTER]
      - path: /api/hub-routes
        methods: [POST]
        roles: [MASTER]
      - path: /api/hub-routes
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/hub-routes/*
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/hub-routes/*
        methods: [PATCH, DELETE]
        roles: [MASTER]

      # --- company-service ---
      - path: /api/companies/*
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER]
      - path: /api/companies/*
        methods: [DELETE]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/products
        methods: [GET, POST]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER]
      - path: /api/products/*
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/products/*
        methods: [PUT, DELETE]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER]

      # --- order-service ---
      - path: /api/orders
        methods: [POST]
        roles: [COMPANY_MANAGER]
      - path: /api/orders
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/orders/*/cancel
        methods: [PATCH]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/orders/*/items/*/cancel
        methods: [PATCH]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/orders/*/items/*
        methods: [PUT]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/orders/*/item/*/status
        methods: [PATCH]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/orders/*
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER]
      - path: /api/orders/*
        methods: [PUT]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/orders/*
        methods: [DELETE]
        roles: [MASTER]

      # --- delivery-service ---
      # 더 구체적인 경로는 반드시 /* 같은 넓은 패턴보다 앞에 와야 함
      # (안 그러면 내부 전용 엔드포인트가 넓은 규칙에 걸려서 실수로 열릴 수 있음)
      # /api/delivery-agents/next는 X-Internal-Service 헤더로 검증하는 내부 전용 API라 규칙을 두지 않음
      # (다른 내부 전용 배송 API들과 동일하게 게이트웨이를 거치지 않고 서비스 간 직접 호출로만 사용 — 규칙이 없으면 기본 거부되어 외부에서는 어차피 막힘)
      - path: /api/delivery-agents
        methods: [POST]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/delivery-agents/*/today-route
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, DELIVERY_MANAGER]
      - path: /api/delivery-agents
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, DELIVERY_MANAGER]
      - path: /api/delivery-agents/*
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, DELIVERY_MANAGER]
      - path: /api/delivery-agents/*
        methods: [PATCH, DELETE]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/deliveries/*/route-records/*/status
        methods: [PATCH]
        roles: [MASTER, HUB_MANAGER, DELIVERY_MANAGER]
      - path: /api/deliveries/*/route-records/*
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/deliveries/*/route-records
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/deliveries/*/company-route-records/*/status
        methods: [PATCH]
        roles: [MASTER, DELIVERY_MANAGER]
      - path: /api/deliveries/*/company-route-records/*/route-plan
        methods: [PATCH]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/deliveries/*/company-route-records
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/deliveries/*/status
        methods: [PATCH]
        roles: [MASTER, HUB_MANAGER, DELIVERY_MANAGER]
      - path: /api/deliveries/*
        methods: [DELETE]
        roles: [MASTER, HUB_MANAGER]
      - path: /api/deliveries/*
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]
      - path: /api/deliveries
        methods: [GET]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]

      # --- ai-notification-service ---
      - path: /api/ai-requests/statistics
        methods: [GET]
        roles: [MASTER]
      - path: /api/ai-requests/*/retry
        methods: [POST]
        roles: [MASTER]
      - path: /api/ai-requests/*
        methods: [GET, DELETE]
        roles: [MASTER]
      - path: /api/ai-requests
        methods: [GET]
        roles: [MASTER]
      - path: /api/slack-messages/retry
        methods: [POST]
        roles: [MASTER]
      - path: /api/slack-messages/*/retry
        methods: [POST]
        roles: [MASTER]
      - path: /api/slack-messages/*
        methods: [GET, PATCH, DELETE]
        roles: [MASTER]
      - path: /api/slack-messages
        methods: [GET]
        roles: [MASTER, DELIVERY_MANAGER]
      - path: /api/slack-messages
        methods: [POST]
        roles: [MASTER, HUB_MANAGER, COMPANY_MANAGER, DELIVERY_MANAGER]

# Swagger UI에 서비스 목록 등록
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /docs/user/v3/api-docs
      - name: Hub Service
        url: /docs/hub/v3/api-docs
      - name: Company Service
        url: /docs/company/v3/api-docs
      - name: Order Service
        url: /docs/order/v3/api-docs
      - name: Delivery Service
        url: /docs/delivery/v3/api-docs
      - name: AI Notification Service
        url: /docs/ai/v3/api-docs
