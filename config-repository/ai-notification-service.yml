server:
  port: 8086

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_db}

  ai:
    model:
      embedding:
        text: ${AI_EMBEDDING_PROVIDER:none}

    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        embedding:
          api-key: ${GEMINI_API_KEY:disabled}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE

# Google Gen AI SDK 직접 호출 설정
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
  temperature: 0.1

slack:
  bot-token: ${SLACK_BOT_TOKEN:}
