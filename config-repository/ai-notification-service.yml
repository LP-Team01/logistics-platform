server:
  port: 8086

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_db}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ai-notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": com.logistics.ai.kafka.event.DeliveryAiNotificationEvent
        "[spring.json.trusted.packages]": com.logistics.ai.kafka.event

    listener:
      ack-mode: record

  ai:
    model:
      embedding:
        text: ${AI_EMBEDDING_PROVIDER:none}

    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        embedding:
          api-key: ${GEMINI_API_KEY:disabled}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE

# Kafka Topic 설정
kafka:
  topic:
    delivery-ai-notification: ${DELIVERY_AI_NOTIFICATION_TOPIC:delivery-ai-notification}

# Google Gen AI SDK 직접 호출 설정
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
  temperature: 0.1
  timeout-ms: ${GEMINI_TIMEOUT_MS:30000}

slack:
  bot-token: ${SLACK_BOT_TOKEN:}
  pending-recovery-minutes: ${SLACK_PENDING_RECOVERY_MINUTES:5}

internal-service:
  key: ${INTERNAL_SERVICE_KEY:}

# 업체 배송 담당자 당일 경로 Slack 알림 스케줄 설정
#
# enabled:
#   true  - 스케줄러 실행
#   false - 스케줄러 중지
#
# cron 작성 순서:
#   초 분 시 일 월 요일
#
# 예시:
#   "0 0 6 * * *"   - 매일 오전 6시
#   "0 30 7 * * *"  - 매일 오전 7시 30분
#   "0 * * * * *"   - 매분 실행(테스트용)
#   "*/10 * * * * *" - 10초마다 실행(테스트용)
#
# 실제 실행 시각은 .env의 DAILY_ROUTE_NOTIFICATION_CRON으로 변경합니다.
# 환경변수가 없으면 콜론 뒤의 기본값인 오전 6시가 사용됩니다.
daily-route-notification:
  enabled: ${DAILY_ROUTE_NOTIFICATION_ENABLED:true}
  cron: "${DAILY_ROUTE_NOTIFICATION_CRON:0 0 6 * * *}"
  zone: "${DAILY_ROUTE_NOTIFICATION_ZONE:Asia/Seoul}"
