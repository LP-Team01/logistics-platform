server:
  port: 8085

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:delivery-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": com.logistics.delivery.infrastructure.kafka.DeliveryCompensationEvent
        "[spring.json.trusted.packages]": com.logistics.delivery.infrastructure.kafka
    listener:
      ack-mode: record

kafka:
  topic:
    delivery-compensation: ${DELIVERY_COMPENSATION_TOPIC:delivery-compensation}

internal:
  service:
    name: delivery-service
    key: ${INTERNAL_SERVICE_KEY}
    allowed-name: order-service
  hub-service:
    key: ${HUB_INTERNAL_SERVICE_KEY}
