server.port: 8085
spring:
  application.name: delivery-service
  config.import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${POSTGRES_USER:logistics}
    password: ${POSTGRES_PASSWORD:logistics}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.enabled: ${KAFKA_ENABLED:false}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include: health,info
