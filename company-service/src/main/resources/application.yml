server.port: 8083
spring:
  application.name: company-service
  config.import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/company_db}
    username: ${POSTGRES_USER:logistics}
    password: ${POSTGRES_PASSWORD:logistics}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include: health,info
