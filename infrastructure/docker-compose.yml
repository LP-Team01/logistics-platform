name: logistics-platform

x-app-common: &app-common
  restart: unless-stopped
  networks: [logistics]
  environment: &common-environment
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    EUREKA_URL: http://${EUREKA_HOST:-eureka-server}:8761/eureka
    CONFIG_SERVER_URL: http://${CONFIG_SERVER_HOST:-config-server}:8888
    INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    HUB_INTERNAL_SERVICE_KEY: ${HUB_INTERNAL_SERVICE_KEY}
    JWT_SECRET: ${JWT_SECRET}
    JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
    JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
    SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    CORS_ALLOWED_ORIGIN_PATTERN: ${CORS_ALLOWED_ORIGIN_PATTERN:-http://localhost:*}
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    POSTGRES_USER: ${POSTGRES_USER:-logistics}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics}
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logistics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistics} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logistics]

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
        - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ logistics ]

  kafka:
    image: apache/kafka:3.9.2
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "</dev/tcp/localhost/29092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [logistics]

  kafka-init:
    image: apache/kafka:3.9.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in delivery-compensation delivery-ai-notification; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 1
        done
    networks: [logistics]

  zipkin:
    image: openzipkin/zipkin:3.6.1
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m
    mem_limit: 512m
    ports:
      - "${ZIPKIN_HOST_PORT:-9411}:9411"
    networks: [logistics]

  eureka-server:
    <<: *app-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: eureka-server }
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    <<: *app-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: config-server }
    environment:
      <<: *common-environment
      SPRING_PROFILES_ACTIVE: native
      CONFIG_SEARCH_LOCATION: file:/config
    volumes:
      - ../config-repository:/config:ro
    ports: ["8888:8888"]
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    <<: *app-common
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      args: { SERVICE: api-gateway }
    ports: ["8080:8080"]
    expose: ["9091"]
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: user-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/user_db?sslmode=${POSTGRES_SSL_MODE:-disable}
    ports: ["8081:8081"]
    depends_on: { config-server: { condition: service_healthy }, postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  hub-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: hub-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/hub_db?sslmode=${POSTGRES_SSL_MODE:-disable}
    ports: ["8082:8082"]
    depends_on: { config-server: { condition: service_healthy }, postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  company-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: company-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/company_db?sslmode=${POSTGRES_SSL_MODE:-disable}
    ports: ["8083:8083"]
    depends_on: { config-server: { condition: service_healthy }, postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  order-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: order-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/order_db?sslmode=${POSTGRES_SSL_MODE:-disable}
    ports: ["8084:8084"]
    depends_on: { config-server: { condition: service_healthy }, postgres: { condition: service_healthy }, kafka-init: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  delivery-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: delivery-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/delivery_db?sslmode=${POSTGRES_SSL_MODE:-disable}
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET}
    ports: ["8085:8085"]
    depends_on: { config-server: { condition: service_healthy }, postgres: { condition: service_healthy }, kafka-init: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ai-notification-service:
    <<: *app-common
    build: { context: .., dockerfile: infrastructure/Dockerfile, args: { SERVICE: ai-notification-service } }
    environment:
      <<: *common-environment
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/ai_db?sslmode=${POSTGRES_SSL_MODE:-disable}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-disabled}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.6-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-disabled}
    ports: ["8086:8086"]
    depends_on: { config-server: { condition: service_healthy }, postgres: { condition: service_healthy }, kafka-init: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    networks: [logistics]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    networks: [logistics]

networks:
  logistics:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
