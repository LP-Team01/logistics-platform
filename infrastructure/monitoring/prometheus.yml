global:
  scrape_interval: 15s

scrape_configs:
  - job_name: logistics-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - eureka-server:8761
          - config-server:8888
          - api-gateway:9091
          - user-service:8081
          - hub-service:8082
          - company-service:8083
          - order-service:8084
          - delivery-service:8085
          - ai-notification-service:8086
